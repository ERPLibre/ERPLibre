# Formatage et tri des imports de l'OUTILLAGE ERPLibre — script/, test/,
# long_test/ et les scripts de la racine.
#
# ruff et non black : son tri d'imports remplace isort sans second outil, et
# c'est ce que la norme OCA emploie depuis qu'elle a quitté black.
#
# Les modules Odoo n'obéissent PAS à ce fichier : chaque dépôt d'addons porte
# sa propre norme. script/maintenance/format_python.sh aiguille entre les deux.
#
# target-version borne ce que le formateur ÉCRIT, et non ce qui exécute le
# code. py310 et non la version du venv : PEP 758 autorise depuis 3.14
# « except A, B: » sans parenthèses, et ruff l'écrirait — or les hooks de
# script/git/hooks portent « #!/usr/bin/env python3 » et tournent donc sur le
# Python du système, qu'une distribution livre encore en 3.10.
target-version = "py310"
# 79, la largeur que le dépôt tient déjà. La norme OCA en retient 88, déclarée
# dans les dépôts d'addons qui la suivent.
line-length = 79

# Des dépôts SÉPARÉS, rapatriés par Google Repo : ils portent leur propre
# configuration, et les reformater écrirait dans l'historique d'autrui.
# force-exclude : sans lui, l'exclusion ne vaut que pour les fichiers que ruff
# DÉCOUVRE, et un chemin nommé en argument y échappe — or format_python.sh
# passe les fichiers un par un.
# « odoo[0-9]* » vise les checkouts odoo<version> ; « odoo* » écarterait
# aussi l'outillage dont le nom commence par odoo, comme script/odoo/.
force-exclude = true
extend-exclude = [
  "addons",
  "odoo[0-9]*",
  "script/OCA_maintainer-tools",
  "script/OCA_odoo-module-migrator",
  "script/gnome-extension/erplibre_home",
  "script/stream_deck/deck",
  "script/stream_deck/games",
]

# Ces fichiers tournent aussi sous le python3 d'un serveur ou d'une image,
# dès Python 3.7 : l'audit envoyé sur stdin à un hôte Debian 10, les outils
# de production lancés par une unité systemd, warmup_http dans l'image
# Docker. py37 interdit au formateur la syntaxe que 3.7 ne lit pas, comme
# les « with » parenthésés. test/test_ops_py37.py vérifie que la liste
# couvre chaque fichier que son garde ast lit, et réciproquement.
[per-file-target-version]
"script/proxmox/host_perf_audit.py" = "py37"
"script/odoo/update_module.py" = "py37"
"script/odoo/log_check.py" = "py37"
"script/odoo/mail_retry.py" = "py37"
"script/odoo/health_check.py" = "py37"
"script/odoo/warmup_http.py" = "py37"
"script/odoo/odoo_conf_check.py" = "py37"
"script/database/odoo_backup.py" = "py37"
"script/systemd/install_backup_timer.py" = "py37"
"script/lib_ops/*.py" = "py37"

[lint]
# Le tri des imports seul : le lint du dépôt reste décrit par .flake8.
select = ["I"]
