# La carte son du modem n'est pas un peripherique du bureau.
#
# Sans cette regle, PipeWire adopte la carte UAC du modem comme source, la
# choisit comme micro PAR DEFAUT, et la tient ouverte en permanence. Trois
# consequences : « arecord -D hw:X,0 » rend « peripherique occupe », toute
# mesure du chemin audio est impossible, et le micro du bureau bascule sans
# prevenir sur une carte qui ne porte du son que pendant un appel.
#
# On la desactive plutot que de la rendre non-defaut : l'outillage d'appel
# l'ouvre directement en ALSA, et n'a besoin d'aucun serveur audio.
#
# La correspondance porte sur le nom de carte ALSA et non sur device.name :
# ce dernier finit par un index qui change au rebranchement.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "EC25-AF"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
