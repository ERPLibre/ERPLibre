# Couverture du générateur de code par les scénarios Odoo :
# `run_odoo_scenarios.py --coverage` pose COVERAGE_RCFILE (ce fichier) et
# COVERAGE_FILE (le répertoire de données du jeu « odoo » de
# script/test/couverture.py) dans l'environnement des scénarios. Le
# « coverage run -p » d'odoo_bin.sh, choisi par les scripts coverage_*.sh,
# lit l'un et l'autre dans l'environnement, depuis la racine du dépôt.
#
# Lu par le coverage du venv Odoo, et non par celui de .venv.erplibre : les
# deux jeux de mesures restent séparés (conf/coverage.erplibre.toml pour
# l'outillage). Au format INI et non TOML : le coverage des venvs Odoo 12 à
# 15 tourne sous un Python sans tomllib.

[run]
branch = True
# Un fichier de données par processus Odoo, que `coverage combine` fusionne.
parallel = True
# Un scénario arrêté reçoit SIGTERM avant SIGKILL (grâce de la campagne) :
# coverage écrit alors ses données au lieu de les perdre.
sigterm = True
# Le seul dépôt du générateur, quelle que soit la version d'Odoo : un motif
# plutôt qu'un chemin « odoo<V>/… ». Les copies du dépôt de gabarits dans
# les bacs à sable n'y répondent pas (« …-template/ »).
include = */addons/TechnoLibre_odoo-code-generator/*
# Des chemins relatifs à la racine : l'historique se compare d'un clone à
# l'autre.
relative_files = True
disable_warnings = no-data-collected, module-not-measured

[report]
skip_empty = True
precision = 2
